[package]
name = "typst-interactive"
version = "0.1.0"
edition = "2024"

[dependencies]
typst = { version = "0.14.2" }
typst-kit = { version = "0.14.2", default-features = false, features = ["embed-fonts"] }
wasm-bindgen = "0.2.106"
typst-html = "0.14.2"
comemo = "0.5.0"
js-sys = "0.3.83"
wasm-bindgen-futures = "0.4.56"
# $env:RUSTFLAGS="-Zlocation-detail=none -Zfmt-debug=none"
# cargo build -Z build-std=std,panic_abort -Z build-std-features="optimize_for_size,panic_immediate_abort" --release --target wasm32-unknown-unknown --features wasm-minimal-protocol --lib

[profile.release]
lto = true          # Enable link-time optimization
strip = true        # Strip symbols from binary*
opt-level = 'z'     # Optimize for size
codegen-units = 1   # Reduce number of codegen units to increase optimizations
panic = 'abort'     # Abort on panic
